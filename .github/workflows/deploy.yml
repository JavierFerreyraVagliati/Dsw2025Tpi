# Pipeline CI/CD de la API Dsw2025Tpi
# Etapas: 1) restaurar + compilar la API  ->  2) construir la imagen Docker y subirla a Docker Hub
#         ->  3) desplegar la imagen en Azure App Service.
# Si una etapa falla, las que dependen de ella (needs) no se ejecutan.
# En pull requests solo se compila y se construye la imagen (sin push ni deploy).
#
# Secrets requeridos (Settings > Secrets and variables > Actions):
#   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN, APP_SERVICE_NAME, AZURE_WEBAPP_PUBLISH_PROFILE

name: CI/CD - API Dsw2025Tpi

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  SOLUTION: Dsw2025Tpi.sln
  IMAGE_NAME: dsw2025tpi-api

jobs:
  build:
    name: Restaurar y compilar API
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Instalar .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restaurar dependencias
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Compilar en Release (compilación limpia)
        run: dotnet build ${{ env.SOLUTION }} --configuration Release --no-restore --no-incremental

  docker:
    name: Construir y publicar imagen Docker
    needs: build
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/dsw2025tpi-api
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Construir la imagen
        run: |
          docker build \
            -t ${{ env.IMAGE }}:${{ github.sha }} \
            -t ${{ env.IMAGE }}:latest \
            -f Dockerfile \
            .

      - name: Iniciar sesión en Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Subir la imagen a Docker Hub
        if: github.event_name != 'pull_request'
        run: |
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

  deploy:
    name: Desplegar en Azure App Service
    needs: docker
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar el contenedor en Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.APP_SERVICE_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
