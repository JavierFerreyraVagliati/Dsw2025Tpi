# Pipeline CI/CD de la API Dsw2025Tpi
# Etapas: 1) restaurar + compilar la API  ->  2) ejecutar las pruebas automatizadas (Quality Gate)
#         ->  3) construir la imagen Docker y subirla a Docker Hub  ->  4) desplegar en Azure App Service.
# En la etapa de pruebas también se mide la cobertura de código (coverlet).
# Si una etapa falla, las que dependen de ella (needs) no se ejecutan:
# si falla una sola prueba, no se construye la imagen ni se despliega.
# En pull requests se compila, se ejecutan las pruebas y se construye la imagen (sin push ni deploy).
#
# Secrets requeridos (Settings > Secrets and variables > Actions):
#   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN, APP_SERVICE_NAME, AZURE_WEBAPP_PUBLISH_PROFILE

name: CI/CD - API Dsw2025Tpi

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  SOLUTION: Dsw2025Tpi.sln
  IMAGE_NAME: dsw2025tpi-api

jobs:
  build:
    name: Restaurar y compilar API
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Instalar .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restaurar dependencias
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Compilar en Release (compilación limpia)
        run: dotnet build ${{ env.SOLUTION }} --configuration Release --no-restore --no-incremental

  test:
    name: Ejecutar pruebas (Quality Gate)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Instalar .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restaurar dependencias
        run: dotnet restore ${{ env.SOLUTION }}

      # Ejecuta todos los proyectos de prueba de la solución (unitarias e integración).
      # Si alguna prueba falla, el comando termina con error y el pipeline se detiene acá.
      - name: Ejecutar pruebas unitarias y de integración
        run: >
          dotnet test ${{ env.SOLUTION }}
          --configuration Release
          --no-restore
          --logger "console;verbosity=normal"
          --logger trx
          --collect:"XPlat Code Coverage"
          --results-directory TestResults

      - name: Resumen de resultados
        if: always()
        run: |
          echo "## Resultados de las pruebas" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Archivo | Total | Correctas | Fallidas |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for f in TestResults/*.trx; do
            [ -f "$f" ] || continue
            c=$(grep -o '<Counters [^>]*>' "$f")
            total=$(echo "$c" | grep -o 'total="[0-9]*"' | grep -o '[0-9]*')
            passed=$(echo "$c" | grep -o 'passed="[0-9]*"' | grep -o '[0-9]*')
            failed=$(echo "$c" | grep -o 'failed="[0-9]*"' | grep -o '[0-9]*')
            echo "| $(basename "$f") | $total | $passed | $failed |" >> "$GITHUB_STEP_SUMMARY"
          done

      # Cobertura de código medida con coverlet (un reporte Cobertura por proyecto de pruebas).
      - name: Resumen de cobertura de código
        if: always()
        run: |
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Cobertura de código" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Pruebas | Líneas cubiertas | Ramas cubiertas |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for f in TestResults/*/coverage.cobertura.xml; do
            [ -f "$f" ] || continue
            line=$(grep -o -m1 'line-rate="[0-9.]*"' "$f" | grep -o '[0-9.]*' | head -1)
            branch=$(grep -o -m1 'branch-rate="[0-9.]*"' "$f" | grep -o '[0-9.]*' | head -1)
            line_pct=$(awk -v r="$line" 'BEGIN { printf "%.1f%%", r * 100 }')
            branch_pct=$(awk -v r="$branch" 'BEGIN { printf "%.1f%%", r * 100 }')
            # El reporte de integración incluye la capa Api; el de unitarias, solo Application y Domain
            if grep -q 'package name="Dsw2025Tpi.Api"' "$f"; then nivel="Integración y E2E"; else nivel="Unitarias"; fi
            echo "| $nivel | $line_pct | $branch_pct |" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Guardar resultados como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-pruebas
          path: |
            TestResults/*.trx
            TestResults/*/coverage.cobertura.xml
          if-no-files-found: warn

  docker:
    name: Construir y publicar imagen Docker
    needs: test
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/dsw2025tpi-api
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Construir la imagen
        run: |
          docker build \
            -t ${{ env.IMAGE }}:${{ github.sha }} \
            -t ${{ env.IMAGE }}:latest \
            -f Dockerfile \
            .

      - name: Iniciar sesión en Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Subir la imagen a Docker Hub
        if: github.event_name != 'pull_request'
        run: |
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

  deploy:
    name: Desplegar en Azure App Service
    needs: docker
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar el contenedor en Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.APP_SERVICE_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
